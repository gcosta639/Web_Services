spring:
  application:
    name: ProjetoFinal
  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Em produção, defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres)
    secret: ${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-com-mais-de-32-caracteres}
    expiration-ms: 3600000

logging:
  level:
    br.puc.ProjetoFinal: DEBUG